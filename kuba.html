<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELORA | Fashion Store</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f7f5;
    color: #222;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 7%;
    background: white;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 5px;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    text-decoration: none;
    color: #222;
    font-size: 14px;
}

.cart-btn {
    border: none;
    background: black;
    color: white;
    padding: 12px 18px;
    cursor: pointer;
}

/* HERO */

.hero {
    height: 480px;
    background:
    linear-gradient(90deg, rgba(0,0,0,.55), transparent),
    url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1600&q=80");

    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 7%;
    color: white;
}

.hero-content {
    max-width: 500px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 17px;
    margin-bottom: 25px;
}

.hero button {
    padding: 15px 30px;
    background: white;
    color: black;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* PRODUCTS */

.container {
    padding: 60px 7%;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 35px;
}

.categories {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.categories button {
    padding: 12px 22px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
}

.categories button.active,
.categories button:hover {
    background: black;
    color: white;
}

.search {
    display: block;
    width: 100%;
    max-width: 400px;
    padding: 14px;
    margin: 0 auto 35px;
    border: 1px solid #ddd;
    outline: none;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.product {
    background: white;
    overflow: hidden;
}

.product img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: .3s;
}

.product:hover img {
    transform: scale(1.04);
}

.product-info {
    padding: 15px;
}

.product-info h3 {
    font-size: 16px;
    margin-bottom: 10px;
}

.price {
    font-weight: bold;
    margin-bottom: 15px;
}

.product-info button {
    width: 100%;
    padding: 12px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

.product-info button:hover {
    background: #444;
}

/* CART */

.cart {
    position: fixed;
    right: -400px;
    top: 0;
    width: 350px;
    height: 100%;
    background: white;
    z-index: 200;
    padding: 25px;
    transition: .3s;
    overflow-y: auto;
    box-shadow: -5px 0 20px rgba(0,0,0,.1);
}

.cart.open {
    right: 0;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.close {
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.cart-item button {
    background: none;
    border: none;
    color: red;
    cursor: pointer;
}

.total {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

.checkout {
    width: 100%;
    padding: 15px;
    background: black;
    color: white;
    border: none;
    margin-top: 20px;
    cursor: pointer;
}

/* FORM */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 300;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: white;
    padding: 30px;width: 100%;
    max-width: 400px;
}

.modal-content h2 {
    margin-bottom: 20px;
}

.modal-content input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
}

.modal-content button {
    width: 100%;
    padding: 14px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

.cancel {
    margin-top: 10px;
    background: #eee !important;
    color: black !important;
}

/* FOOTER */

footer {
    background: #111;
    color: white;
    padding: 40px 7%;
    text-align: center;
}

footer p {
    margin-top: 12px;
    color: #aaa;
}

/* MOBILE */

@media (max-width: 900px) {

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product img {
        height: 230px;
    }

    .hero {
        height: 380px;
    }

    .hero h1 {
        font-size: 38px;
    }

    nav {
        display: none;
    }

    .container {
        padding: 40px 4%;
    }

}

@media (max-width: 400px) {

    .product img {
        height: 190px;
    }

    .logo {
        font-size: 22px;
    }

    .cart {
        width: 100%;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">VELORA</div>

    <nav>
        <a href="#home">Главная</a>
        <a href="#shop">Каталог</a>
        <a href="#footer">Контакты</a>
    </nav>

    <button class="cart-btn" onclick="openCart()">
        🛍 Корзина (<span id="cartCount">0</span>)
    </button>

</header>

<section class="hero" id="home">

    <div class="hero-content">

        <h1>New Collection</h1>

        <p>
            Современная одежда для тех,
            кто выбирает свой стиль.
        </p>

        <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
            Смотреть коллекцию
        </button>

    </div>

</section>

<section class="container" id="shop">

    <h2 class="section-title">Наш каталог</h2>

    <div class="categories">

        <button class="active" onclick="filterProducts('all', this)">
            Все
        </button>

        <button onclick="filterProducts('Футболки', this)">
            Футболки
        </button>

        <button onclick="filterProducts('Худи', this)">
            Худи
        </button>

        <button onclick="filterProducts('Куртки', this)">
            Куртки
        </button>

        <button onclick="filterProducts('Брюки', this)">
            Брюки
        </button>

    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Поиск одежды..."
        oninput="searchProducts()"
    >

    <div class="products" id="products"></div>

</section>

<!-- CART -->

<div class="cart" id="cart">

    <div class="cart-header">

        <h2>Корзина</h2>

        <button class="close" onclick="closeCart()">×</button>

    </div>

    <div id="cartItems"></div>

    <div class="total">
        Итого: <span id="total">0</span> сом
    </div>

    <button class="checkout" onclick="checkout()">
        Оформить заказ
    </button>

</div>

<!-- ORDER FORM -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Оформление заказа</h2>

        <form id="orderForm">

            <input
                type="text"
                id="name"
                placeholder="Ваше имя"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Номер телефона"
                required
            >

            <input
                type="text"
                id="address"
                placeholder="Адрес доставки"
                required
            >

            <button type="submit">
                Подтвердить заказ
            </button>

        </form>

        <button class="cancel" onclick="closeModal()">
            Отмена
        </button>

    </div>

</div>

<footer id="footer">

    <h2>VELORA</h2>

    <p>Современная одежда. Твой стиль.</p>

    <p>© 2026 VELORA Fashion Store</p>

</footer>

<script>

// PRODUCTS

const products = [

{id: 1,
    name: "Basic White T-Shirt",
    category: "Футболки",
    price: 1200,
    image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
},

{
    id: 2,
    name: "Black Oversize T-Shirt",
    category: "Футболки",
    price: 1500,
    image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=600&q=80"
},

{
    id: 3,
    name: "Classic Hoodie",
    category: "Худи",
    price: 2800,
    image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=600&q=80"
},

{
    id: 4,
    name: "Street Hoodie",
    category: "Худи",
    price: 3200,
    image: "https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=600&q=80"
},

{
    id: 5,
    name: "Denim Jacket",
    category: "Куртки",
    price: 4500,
    image: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&w=600&q=80"
},

{
    id: 6,
    name: "Winter Jacket",
    category: "Куртки",
    price: 6500,
    image: "https://images.unsplash.com/photo-1544923246-77307dd654cb?auto=format&fit=crop&w=600&q=80"
},

{
    id: 7,
    name: "Classic Jeans",
    category: "Брюки",
    price: 3500,
    image: "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=600&q=80"
},

{
    id: 8,
    name: "Wide Leg Pants",
    category: "Брюки",
    price: 3000,
    image: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=600&q=80"
}

];

// CART

let cart = JSON.parse(localStorage.getItem("veloraCart")) || [];

let currentCategory = "all";

// SHOW PRODUCTS

function showProducts(list) {

    const productsContainer = document.getElementById("products");

    productsContainer.innerHTML = "";

    if (list.length === 0) {
        productsContainer.innerHTML = "<p>Товары не найдены</p>";
        return;
    }

    list.forEach(product => {

        productsContainer.innerHTML += `

            <div class="product">

                <img src="${product.image}" alt="${product.name}">

                <div class="product-info">

                    <h3>${product.name}</h3>

                    <div class="price">
                        ${product.price.toLocaleString()} сом
                    </div>

                    <button onclick="addToCart(${product.id})">
                        Добавить в корзину
                    </button>

                </div>

            </div>

        `;

    });

}

// FILTER

function filterProducts(category, button) {

    currentCategory = category;

    document.querySelectorAll(".categories button").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    let filtered = products;

    if (category !== "all") {
        filtered = products.filter(p => p.category === category);
    }

    showProducts(filtered);

}

// SEARCH

function searchProducts() {

    const search = document.getElementById("search").value.toLowerCase();

    let filtered = products.filter(product => {

        return product.name.toLowerCase().includes(search);

    });

    if (currentCategory !== "all") {

        filtered = filtered.filter(product => {
            return product.category === currentCategory;
        });

    }

    showProducts(filtered);

}

// ADD TO CART

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            ...product,
            quantity: 1
        });
    }

    saveCart();

    alert("Товар добавлен в корзину!");

}

// SAVE CART

function saveCart() {

    localStorage.setItem("veloraCart", JSON.stringify(cart));

    updateCart();

}

// UPDATE CART

function updateCart() {

    const cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;

    let count = 0;

    cart.forEach(item => {

        total += item.price * item.quantity;count += item.quantity;

        cartItems.innerHTML += `

            <div class="cart-item">

                <div>
                    <strong>${item.name}</strong>

                    <p>${item.price} сом × ${item.quantity}</p>

                    <button onclick="changeQuantity(${item.id}, -1)">−</button>

                    <button onclick="changeQuantity(${item.id}, 1)">+</button>

                </div>

                <button onclick="removeFromCart(${item.id})">
                    ✕
                </button>

            </div>

        `;

    });

    document.getElementById("total").textContent =
        total.toLocaleString();

    document.getElementById("cartCount").textContent = count;

}

// CHANGE QUANTITY

function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart = cart.filter(p => p.id !== id);

    }

    saveCart();

}

// REMOVE

function removeFromCart(id) {

    cart = cart.filter(item => item.id !== id);

    saveCart();

}

// OPEN CART

function openCart() {

    document.getElementById("cart").classList.add("open");

}

// CLOSE CART

function closeCart() {

    document.getElementById("cart").classList.remove("open");

}

// CHECKOUT

function checkout() {

    if (cart.length === 0) {

        alert("Корзина пустая!");

        return;

    }

    document.getElementById("modal").style.display = "flex";

}

// CLOSE MODAL

function closeModal() {

    document.getElementById("modal").style.display = "none";

}

// ORDER FORM

document.getElementById("orderForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value;

    const phone = document.getElementById("phone").value;

    const address = document.getElementById("address").value;

    let orderText = "";

    cart.forEach(item => {

        orderText +=
            item.name + " × " +
            item.quantity + " = " +
            item.price * item.quantity + " сом\n";

    });

    const total = cart.reduce((sum, item) => {
        return sum + item.price * item.quantity;
    }, 0);

    alert(

        "Заказ оформлен!\n\n" +

        "Имя: " + name + "\n" +

        "Телефон: " + phone + "\n" +

        "Адрес: " + address + "\n\n" +

        orderText +

        "\nИтого: " + total + " сом"

    );

    cart = [];

    saveCart();

    closeModal();

    closeCart();

    this.reset();

});

// INIT

showProducts(products);

updateCart();

</script>

</body>
</html>
