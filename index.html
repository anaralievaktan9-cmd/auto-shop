<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Shop</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; }

/* ===== БЕТТЕРДИ АЛМАШТЫРУУ МЕНЮСУ ===== */
.site-bar { background: #111; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 500; }
.site-bar button { padding: 8px 18px; margin: 0 5px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; background: #444; color: #fff; }
.site-bar button.active { background: #fff; color: #000; font-weight: bold; }

/* ================================================== */
/* ===== АКТАН: КАТАЛОГ БЕТИНИН СТИЛИ (#cars-page) == */
/* ================================================== */
#cars-page { background: #f2f4f8; color: #222; min-height: 100vh; }
#cars-page header { background: #1f2a44; color: #fff; padding: 20px; text-align: center; }
#cars-page .controls { display: flex; gap: 10px; justify-content: center; padding: 20px; flex-wrap: wrap; }
#cars-page .controls input, #cars-page .controls select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
#cars-page #car-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; }
#cars-page .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
#cars-page .card .icon { font-size: 60px; text-align: center; }
#cars-page .card h3 { margin: 10px 0 5px; }
#cars-page .card p { color: #666; margin-bottom: 5px; }
#cars-page .card .price { font-weight: bold; color: #1a7f37; font-size: 20px; margin: 10px 0; }
#cars-page .card button { width: 100%; padding: 10px; border: none; background: #1f2a44; color: #fff; border-radius: 6px; cursor: pointer; font-size: 16px; }
#cars-page .card button:hover { background: #33446e; }
#cars-page .empty { text-align: center; color: #888; grid-column: 1 / -1; }

/* ================================================== */
/* ===== КУБА: ДҮКӨН БЕТИНИН СТИЛИ (#shop-page) ===== */
/* ================================================== */
#shop-page { background: #f8f7f5; color: #222; }
#shop-page header { display: flex; justify-content: space-between; align-items: center; padding: 22px 7%; background: white; border-bottom: 1px solid #eee; color: #222; }
#shop-page .logo { font-size: 27px; font-weight: bold; letter-spacing: 5px; }
#shop-page nav { display: flex; gap: 25px; }
#shop-page nav a { text-decoration: none; color: #222; font-size: 14px; }
#shop-page .cart-btn { border: none; background: black; color: white; padding: 12px 18px; cursor: pointer; }
#shop-page .hero { height: 380px; background: linear-gradient(90deg, #111, #2b3a5c); display: flex; align-items: center; padding: 7%; color: white; }
#shop-page .hero-content { max-width: 500px; }
#shop-page .hero h1 { font-size: 50px; margin-bottom: 20px; }
#shop-page .hero p { font-size: 17px; margin-bottom: 25px; }
#shop-page .hero button { padding: 15px 30px; background: white; color: black; border: none; cursor: pointer; font-weight: bold; }
#shop-page .container { padding: 60px 7%; }
#shop-page .section-title { text-align: center; font-size: 32px; margin-bottom: 35px; }
#shop-page .categories { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
#shop-page .categories button { padding: 12px 22px; border: 1px solid #ddd; background: white; cursor: pointer; }
#shop-page .categories button.active, #shop-page .categories button:hover { background: black; color: white; }
#shop-page .search { display: block; width: 100%; max-width: 400px; padding: 14px; margin: 0 auto 35px; border: 1px solid #ddd; outline: none; }
#shop-page .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
#shop-page .product { background: white; overflow: hidden; }
#shop-page .product .car-img { height: 180px; display: flex; align-items: center; justify-content: center; font-size: 90px; background: #eef1f6; }
#shop-page .product-info { padding: 15px; }
#shop-page .product-info h3 { font-size: 16px; margin-bottom: 10px; }
#shop-page .price { font-weight: bold; margin-bottom: 15px; }
#shop-page .product-info button { width: 100%; padding: 12px; border: none; background: black; color: white; cursor: pointer; }
#shop-page .product-info button:hover { background: #444; }
#shop-page .cart { position: fixed; right: -400px; top: 0; width: 350px; height: 100%; background: white; z-index: 600; padding: 25px; transition: .3s; overflow-y: auto; box-shadow: -5px 0 20px rgba(0,0,0,.1); }
#shop-page .cart.open { right: 0; }
#shop-page .cart-header { display: flex; justify-content: space-between; margin-bottom: 25px; }
#shop-page .close { border: none; background: none; font-size: 25px; cursor: pointer; }
#shop-page .cart-item { display: flex; justify-content: space-between; gap: 10px; padding: 15px 0; border-bottom: 1px solid #eee; }
#shop-page .cart-item button { background: none; border: none; color: red; cursor: pointer; }
#shop-page .total { margin-top: 25px; font-size: 20px; font-weight: bold; }
#shop-page .checkout { width: 100%; padding: 15px; background: black; color: white; border: none; margin-top: 20px; cursor: pointer; }
#shop-page .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 700; justify-content: center; align-items: center; padding: 15px; }
#shop-page .modal-content { background: white; padding: 30px; width: 100%; max-width: 400px; }
#shop-page .modal-content h2 { margin-bottom: 20px; }
#shop-page .modal-content input { width: 100%; padding: 13px; margin-bottom: 15px; border: 1px solid #ddd; }
#shop-page .modal-content button { width: 100%; padding: 14px; background: black; color: white; border: none; cursor: pointer; }
#shop-page .cancel { margin-top: 10px; background: #eee !important; color: black !important; }
#shop-page footer { background: #111; color: white; padding: 40px 7%; text-align: center; }
#shop-page footer p { margin-top: 12px; color: #aaa; }

@media (max-width: 900px) {
  #shop-page .products { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  #shop-page .hero { height: 320px; }
  #shop-page .hero h1 { font-size: 36px; }
  #shop-page nav { display: none; }
  #shop-page .container { padding: 40px 4%; }
}
@media (max-width: 400px) {
  #shop-page .logo { font-size: 22px; }
  #shop-page .cart { width: 100%; }
}
</style>
</head>
<body>

<!-- ===== БЕТТЕРДИ АЛМАШТЫРУУ ===== -->
<div class="site-bar">
  <button id="btn-cars" class="active" onclick="showPage('cars')">🚗 Каталог</button>
  <button id="btn-shop" onclick="showPage('shop')">🛒 Дүкөн</button>
</div>

<!-- ================================================== -->
<!-- ===== АКТАН: КАТАЛОГ БЕТИ (башталышы) ============ -->
<!-- ================================================== -->
<div id="cars-page">
  <header><h1>🚗 Auto Shop</h1></header>

  <div class="controls">
    <input type="text" id="car-search" placeholder="Машинаны издөө...">
    <select id="car-brand">
      <option value="all">Бардык маркалар</option>
    </select>
  </div>

  <main id="car-list"></main>
</div>
<!-- ===== АКТАН: КАТАЛОГ БЕТИ (аягы) ===== -->


<!-- ================================================== -->
<!-- ===== КУБА: ДҮКӨН БЕТИ (башталышы) =============== -->
<!-- ================================================== -->
<div id="shop-page" style="display:none">

<header>
    <div class="logo">AUTO</div>
    <nav>
        <a href="#home">Главная</a>
        <a href="#shop">Каталог</a>
        <a href="#footer">Контакты</a>
    </nav>
    <button class="cart-btn" onclick="openCart()">
        🛒 Корзина (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero" id="home">
    <div class="hero-content">
        <h1>Новые автомобили</h1>
        <p>Выбирайте машину своей мечты по лучшей цене.</p>
        <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
            Смотреть машины
        </button>
    </div>
</section>

<section class="container" id="shop">
    <h2 class="section-title">Наши автомобили</h2>

    <div class="categories">
        <button class="active" onclick="filterProducts('all', this)">Все</button>
        <button onclick="filterProducts('Седан', this)">Седан</button>
        <button onclick="filterProducts('Внедорожник', this)">Внедорожник</button>
        <button onclick="filterProducts('Электро', this)">Электро</button>
        <button onclick="filterProducts('Хэтчбек', this)">Хэтчбек</button>
    </div>

    <input type="text" class="search" id="search" placeholder="Поиск машины..." oninput="searchProducts()">

    <div class="products" id="products">
    <img src="" alt="">
    </div>
</section>

<!-- CART -->
<div class="cart" id="cart">
    <div class="cart-header">
        <h2>Корзина</h2>
        <button class="close" onclick="closeCart()">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="total">Итого: $<span id="total">0</span></div>
    <button class="checkout" onclick="checkout()">Оформить заказ</button>
</div>

<!-- ORDER FORM -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2>Оформление заказа</h2>
        <form id="orderForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Номер телефона" required>
            <input type="text" id="address" placeholder="Адрес" required>
            <button type="submit">Подтвердить заказ</button>
        </form>
        <button class="cancel" onclick="closeModal()">Отмена</button>
    </div>
</div>

<footer id="footer">
    <h2>AUTO</h2>
    <p>Лучшие автомобили. Лучшие цены.</p>
    <p>© 2026 Auto Shop</p>
</footer>

</div>
<!-- ===== КУБА: ДҮКӨН БЕТИ (аягы) ===== -->


<script>
/* ===== БЕТТЕРДИ АЛМАШТЫРУУ ===== */
function showPage(name) {
  document.getElementById("cars-page").style.display = name === "cars" ? "block" : "none";
  document.getElementById("shop-page").style.display = name === "shop" ? "block" : "none";
  document.getElementById("btn-cars").classList.toggle("active", name === "cars");
  document.getElementById("btn-shop").classList.toggle("active", name === "shop");
  window.scrollTo(0, 0);
}
</script>

<script>
/* ================================================== */
/* ===== АКТАН: КАТАЛОГ СКРИПТИ ===================== */
/* ================================================== */
const cars = [
  { id: 1, name: "Camry", brand: "Toyota", year: 2020, price:12222 },
  { id: 2, name: "Corolla", brand: "Toyota", year: 2018, price: 12000 },
  { id: 3, name: "Civic", brand: "Honda", year: 2019, price: 14500 },
  { id: 4, name: "Accord", brand: "Honda", year: 2021, price: 21000 },
  { id: 5, name: "E-Class", brand: "Mercedes", year: 2017, price: 25000 },
  { id: 6, name: "X5", brand: "BMW", year: 2020, price: 38000 }
];

const carListEl = document.getElementById("car-list");
const carSearchEl = document.getElementById("car-search");
const carBrandEl = document.getElementById("car-brand");

[...new Set(cars.map(c => c.brand))].forEach(b => {
  carBrandEl.innerHTML += `<option value="${b}">${b}</option>`;
});

function renderCars() {
  const text = carSearchEl.value.toLowerCase();
  const brand = carBrandEl.value;

  const filtered = cars.filter(c =>
    (brand === "all" || c.brand === brand) &&
    (c.name + " " + c.brand).toLowerCase().includes(text)
  );

  if (filtered.length === 0) {
    carListEl.innerHTML = '<p class="empty">Машина табылган жок</p>';
    return;
  }

  carListEl.innerHTML = filtered.map(c => `
    <div class="card">
      <div class="icon">🚘</div>
      <h3>${c.brand} ${c.name}</h3>
      <p>Жылы: ${c.year}</p>
      <div class="price">$${c.price.toLocaleString()}</div>
      <button onclick="buyCar(${c.id})">Сатып алуу</button>
    </div>
  `).join("");
}

function buyCar(id) {
  const car = cars.find(c => c.id === id);
  alert(car.brand + " " + car.name + " тандалды!");
}

carSearchEl.addEventListener("input", renderCars);
carBrandEl.addEventListener("change", renderCars);
renderCars();
</script>

<script>
/* ================================================== */
/* ===== КУБА: ДҮКӨН СКРИПТИ ======================== */
/* ================================================== */

// PRODUCTS
const products = [
{ id: 1, name: "Toyota Camry", category: "Седан", price: 18500, icon: "🚗" },
{ id: 2, name: "Honda Accord", category: "Седан", price: 21000, icon: "🚘" },
{ id: 3, name: "BMW X5", category: "Внедорожник", price: 38000, icon: "🚙" },
{ id: 4, name: "Toyota Land Cruiser", category: "Внедорожник", price: 52000, icon: "🚙" },
{ id: 5, name: "Tesla Model 3", category: "Электро", price: 35000, icon: "⚡" },
{ id: 6, name: "Nissan Leaf", category: "Электро", price: 17000, icon: "🔋" },
{ id: 7, name: "Volkswagen Golf", category: "Хэтчбек", price: 15500, icon: "🚗" },
{ id: 8, name: "Honda Fit", category: "Хэтчбек", price: 9800, icon: "🚘" }
];

// CART
let cart = JSON.parse(localStorage.getItem("autoCart")) || [];
let currentCategory = "all";

// SHOW PRODUCTS
function showProducts(list) {
    const productsContainer = document.getElementById("products");
    productsContainer.innerHTML = "";

    if (list.length === 0) {
        productsContainer.innerHTML = "<p>Машины не найдены</p>";
        return;
    }

    list.forEach(product => {
        productsContainer.innerHTML += `
            <div class="product">
                <div class="car-img">${product.icon}</div>
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <div class="price">$${product.price.toLocaleString()}</div>
                    <button onclick="addToCart(${product.id})">Добавить в корзину</button>
                </div>
            </div>
        `;
    });
}

// FILTER
function filterProducts(category, button) {
    currentCategory = category;
 { id: 8, name: "Honda Fit", category: "Хэтчбек", price: 9800, icon: "🚘" },
{ id: 9, name: "Mercedes G-Class", category: "Внедорожник", price: 120000, icon: "🚙" },
{ id: 10, name: "BMW 3 Series", category: "Седан", price: 28000, icon: "🚗" }
    document.querySelectorAll("#shop-page .categories button").forEach(btn => {
        btn.classList.remove("active");
    });
    button.classList.add("active");

    let filtered = products;
    if (category !== "all") {
        filtered = products.filter(p => p.category === category);
    }
    showProducts(filtered);
}

// SEARCH
function searchProducts() {
    const search = document.getElementById("search").value.toLowerCase();

    let filtered = products.filter(product => product.name.toLowerCase().includes(search));

    if (currentCategory !== "all") {
        filtered = filtered.filter(product => product.category === currentCategory);
    }
    showProducts(filtered);
}

// ADD TO CART
function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    saveCart();
    alert("Машина добавлена в корзину!");
}

// SAVE CART
function saveCart() {
    localStorage.setItem("autoCart", JSON.stringify(cart));
    updateCart();
}

// UPDATE CART
function updateCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <div>
                    <strong>${item.name}</strong>
                    <p>$${item.price.toLocaleString()} × ${item.quantity}</p>
                    <button onclick="changeQuantity(${item.id}, -1)">−</button>
                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                </div>
                <button onclick="removeFromCart(${item.id})">✕</button>
            </div>
        `;
    });

    document.getElementById("total").textContent = total.toLocaleString();
    document.getElementById("cartCount").textContent = count;
}

// CHANGE QUANTITY
function changeQuantity(id, amount) {
    const item = cart.find(p => p.id === id);
    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
    }
    saveCart();
}

// REMOVE
function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    saveCart();
}

// OPEN / CLOSE CART
function openCart() { document.getElementById("cart").classList.add("open"); }
function closeCart() { document.getElementById("cart").classList.remove("open"); }

// CHECKOUT
function checkout() {
    if (cart.length === 0) {
        alert("Корзина пустая!");
        return;
    }
    document.getElementById("modal").style.display = "flex";
}

// CLOSE MODAL
function closeModal() { document.getElementById("modal").style.display = "none"; }

// ORDER FORM
document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;

    let orderText = "";
    cart.forEach(item => {
        orderText += item.name + " × " + item.quantity + " = $" + item.price * item.quantity + "\n";
    });

    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    alert(
        "Заказ оформлен!\n\n" +
        "Имя: " + name + "\n" +
        "Телефон: " + phone + "\n" +
        "Адрес: " + address + "\n\n" +
        orderText +
        "\nИтого: $" + total
    );

    cart = [];
    saveCart();
    closeModal();
    closeCart();
    this.reset();
});

// INIT
showProducts(products);
updateCart();
</script>

</body>
</html>
